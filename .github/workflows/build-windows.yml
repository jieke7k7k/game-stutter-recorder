name: Build Windows exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile recorder.py
      - name: Smoke test analyze sample
        run: python recorder.py --analyze tests/sample_presentmon.csv
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --windowed --name GameStutterRecorder recorder.py
      - name: List dist
        run: dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: GameStutterRecorder-windows
          path: dist/
